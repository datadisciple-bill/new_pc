services:
  equinix-pricing-tool:
    build: .
    container_name: equinix-pricing-tool
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      - TZ=America/New_York
    volumes:
      # Persist fetched API data across rebuilds.
      # Run `npm run fetch-data` locally, then the file at
      # ./data/defaults.json will be served at /data/defaults.json.
      - ./data:/usr/share/nginx/html/data
    networks:
      - cloudflared
    # Unraid Docker-page labels (optional).
    # Unraid downloads the icon URL server-side with curl and saves it as <name>-icon.png,
    # so it must be a direct PNG URL with no auth/WAF in front of it. equinix.com returns
    # 403 to curl, which is why the old favicon.ico link showed as broken.
    labels:
      net.unraid.docker.managed: "dockerman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8088]"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/datadisciple-bill/new_pc/main/equinix-pricing-tool/public/favicon.png"

  # Cloudflare Tunnel connector. The token comes from .env next to this file, which is
  # not tracked in git; this repo is public, so never put the token in this file.
  # To rotate: set TUNNEL_TOKEN in .env, then `docker compose up -d --force-recreate cloudflared`.
  # To upgrade: bump the tag below, then `docker compose pull cloudflared && docker compose up -d cloudflared`.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    container_name: cloudflared
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env (see .env.example)}
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    depends_on:
      - equinix-pricing-tool
    networks:
      - cloudflared
    labels:
      # Same icon Unraid Community Applications uses for its cloudflared template.
      net.unraid.docker.icon: "https://raw.githubusercontent.com/selfhosters/unRAID-CA-templates/master/templates/img/cloudflared.png"

networks:
  cloudflared:
    name: cloudflared
